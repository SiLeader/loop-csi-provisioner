apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: loop-e2e
provisioner: loop-csi-provisioner
parameters:
  url: nfs://nfs-server.loop-csi-nfs.svc.cluster.local/loop
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
# Shares the text of --allowed-url-prefix but not a path boundary; provisioning must be refused.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: loop-e2e-forbidden
provisioner: loop-csi-provisioner
parameters:
  url: nfs://nfs-server.loop-csi-nfs.svc.cluster.local/loop-other
reclaimPolicy: Delete
volumeBindingMode: Immediate
