apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: loop-csi-node
  namespace: loop-csi
spec:
  template:
    spec:
      containers:
        - name: driver
          args:
            - --node-api
            - --identity-api
            - --listen=unix:///csi/csi.sock
            - --base-directory=/var/lib/loop-csi-provisioner
            - --allowed-url-prefix=nfs://nfs-server.loop-csi-nfs.svc.cluster.local/loop
            - --plaintext-log
