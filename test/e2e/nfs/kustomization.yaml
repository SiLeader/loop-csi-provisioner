# Deploys the driver for the kind e2e test with BACKEND=nfs (see run.sh): the locally built
# image and the NFS export of server.yaml, which the controller and node pods mount themselves.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../deploy/manifests
  - storageclass.yaml
images:
  - name: ghcr.io/sileader/loop-csi-provisioner
    newName: loop-csi-provisioner
    newTag: e2e
patches:
  - path: controller-patch.yaml
  - path: node-patch.yaml
