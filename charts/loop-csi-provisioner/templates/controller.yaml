{{- $sidecars := .Values.sidecars }}
{{- with .Values.controller }}
# With several replicas, each sidecar's leader election picks the replica that serves it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loop-csi-provisioner.fullname" $ }}-controller
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "loop-csi-provisioner.labels" $ | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .replicas }}
  # Stop all old pods first: earlier drivers do not share this version's storage locks.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "loop-csi-provisioner.selectorLabels" (dict "context" $ "component" "controller") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loop-csi-provisioner.selectorLabels" (dict "context" $ "component" "controller") | nindent 8 }}
        {{- with .podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "loop-csi-provisioner.serviceAccountName" $ }}
      {{- with .priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: driver
          image: {{ include "loop-csi-provisioner.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - --controller-api
            - --identity-api
            {{- include "loop-csi-provisioner.driverArgs" $ | nindent 12 }}
            {{- with $.Values.defaultSize }}
            - --default-size={{ int64 . }}
            {{- end }}
            {{- with .extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "loop-csi-provisioner.driverEnv" $ | nindent 12 }}
            {{- with .extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            # The controller mounts the backing NFS export itself.
            privileged: true
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
            - name: base
              mountPath: /var/lib/loop-csi-provisioner
            {{- with .extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with $sidecars.provisioner }}
        - name: csi-provisioner
          image: {{ include "loop-csi-provisioner.sidecarImage" . }}
          imagePullPolicy: {{ .image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ $.Release.Namespace }}
            - --timeout={{ .timeout }}
            {{- with .extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
        {{- end }}
        {{- with $sidecars.attacher }}
        - name: csi-attacher
          image: {{ include "loop-csi-provisioner.sidecarImage" . }}
          imagePullPolicy: {{ .image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ $.Release.Namespace }}
            {{- with .extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
        {{- end }}
        {{- with $sidecars.resizer }}
        - name: csi-resizer
          image: {{ include "loop-csi-provisioner.sidecarImage" . }}
          imagePullPolicy: {{ .image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ $.Release.Namespace }}
            {{- with .extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
        {{- end }}
      volumes:
        - name: socket
          emptyDir: {}
        - name: base
          emptyDir: {}
        {{- with .extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
