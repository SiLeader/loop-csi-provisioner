name: Run Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-unit-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-unit-test
            ${{ runner.os }}-${{ runner.arch }}-build
            ${{ runner.os }}-${{ runner.arch }}-

      - name: Run tests
        shell: bash
        run: cargo test --all --all-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check code formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Run Clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

  license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-deny-${{ vars.CARGO_DENY_VERSION }}

      - name: Setup cargo-deny
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install --locked cargo-deny --version ${{ vars.CARGO_DENY_VERSION }}
          fi

      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-license-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-license-check
            ${{ runner.os }}-${{ runner.arch }}-build
            ${{ runner.os }}-${{ runner.arch }}

      - name: Check license compliance
        shell: bash
        run: cargo deny check licenses

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-deny-${{ vars.CARGO_DENY_VERSION }}

      - name: Setup cargo-deny
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install --locked cargo-deny --version ${{ vars.CARGO_DENY_VERSION }}
          fi

      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-cargo-deny-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-cargo-deny-check
            ${{ runner.os }}-${{ runner.arch }}-build
            ${{ runner.os }}-${{ runner.arch }}

      - name: Check license compliance
        shell: bash
        run: cargo deny check
