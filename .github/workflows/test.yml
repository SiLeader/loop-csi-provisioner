name: Run Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-unit-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-unit-test
            ${{ runner.os }}-${{ runner.arch }}-build
            ${{ runner.os }}-${{ runner.arch }}-

      - name: Run tests
        shell: bash
        run: cargo test --all --all-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Check code formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Run Clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

  license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-deny-${{ vars.CARGO_DENY_VERSION }}

      - name: Setup cargo-deny
        shell: bash
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install --locked cargo-deny --version ${{ vars.CARGO_DENY_VERSION }}
          fi

      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-license-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-license-check
            ${{ runner.os }}-${{ runner.arch }}-build
            ${{ runner.os }}-${{ runner.arch }}

      - name: Check license compliance
        shell: bash
        run: cargo deny check licenses

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-deny-${{ vars.CARGO_DENY_VERSION }}

      - name: Setup cargo-deny
        shell: bash
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install --locked cargo-deny --version ${{ vars.CARGO_DENY_VERSION }}
          fi

      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-cargo-deny-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-cargo-deny-check
            ${{ runner.os }}-${{ runner.arch }}-build
            ${{ runner.os }}-${{ runner.arch }}

      - name: Check license compliance
        shell: bash
        run: cargo deny check

  helm:
    # The runner image ships helm.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the chart
        shell: bash
        run: helm lint --strict charts/loop-csi-provisioner --values test/e2e/helm-values.yaml

      - name: Refuse to render without allowedUrlPrefixes
        shell: bash
        run: |
          if helm template charts/loop-csi-provisioner > /dev/null; then
            echo "::error::the chart rendered without allowedUrlPrefixes"
            exit 1
          fi

  e2e:
    # Runs the driver on a kind cluster (the runner image ships kind, kubectl and helm).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        deploy: [kustomize, helm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run end-to-end test on kind
        shell: bash
        env:
          DEPLOY: ${{ matrix.deploy }}
        run: test/e2e/run.sh
