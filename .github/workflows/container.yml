name: Build and Push Container Image

on:
  workflow_dispatch:

jobs:
  build-container:
    strategy:
      matrix:
        runner:
          - ubuntu-latest # x64
          - ubuntu-24.04-arm # arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from Cargo.toml
        id: extract_version
        run: |
          version=$(grep -E '^version\s*=' Cargo.toml | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
          echo "Version extracted: v$version"
          echo "version=v$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          labels: |
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.version=${{ steps.extract_version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/loop-csi-provisioner:latest
            ghcr.io/${{ github.repository_owner }}/loop-csi-provisioner:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/loop-csi-provisioner:${{ steps.extract_version.outputs.version }}
