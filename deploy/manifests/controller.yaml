# Raise `replicas` for standby controllers: each sidecar's leader election picks the replica that
# serves it, and the driver serializes operations per volume across pods with a file lock on the
# backing storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loop-csi-controller
  namespace: loop-csi
spec:
  replicas: 1
  # Start the new pod before stopping the old one; the sidecars' leases hand over the work.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: loop-csi-controller
  template:
    metadata:
      labels:
        app: loop-csi-controller
    spec:
      serviceAccountName: loop-csi-controller
      containers:
        - name: driver
          image: ghcr.io/sileader/loop-csi-provisioner:v0.1.1
          args:
            - --controller-api
            - --identity-api
            - --listen=unix:///csi/csi.sock
            - --base-directory=/var/lib/loop-csi-provisioner
            # Placeholder: replace with the storage URL(s) used by your StorageClasses.
            # 127.0.0.1 would be the pod itself, not an NFS server.
            - --allowed-url-prefix=nfs://127.0.0.1/share
          securityContext:
            # The controller mounts the backing NFS export itself.
            privileged: true
          volumeMounts:
            - name: socket
              mountPath: /csi
            - name: base
              mountPath: /var/lib/loop-csi-provisioner
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --timeout=120s
          volumeMounts:
            - name: socket
              mountPath: /csi
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.8.0
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
          volumeMounts:
            - name: socket
              mountPath: /csi
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v1.13.1
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
          volumeMounts:
            - name: socket
              mountPath: /csi
      volumes:
        - name: socket
          emptyDir: {}
        - name: base
          emptyDir: {}
